name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Include the error shown on the result card, if any.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Claude Code
        - Codex
        - Anthropic API
        - OpenAI API
        - OpenAI-compatible server (Ollama, LM Studio…)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 15.4
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Please don't paste API keys or private text.
